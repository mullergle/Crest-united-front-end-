<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crest United Bank | Premium Cards</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --ink:#07151b; --deep:#0a2223; --deep2:#103536; --green:#1e6256; --green2:#2c806c;
    --mint:#b8e0ca; --cream:#f5f2e8; --white:#fff; --text:#eef5f1; --muted:#8fa39d; --gold:#c9a96b;
    --line:rgba(255,255,255,.08); --card:rgba(255,255,255,.045); --danger:#d98b8b; --shadow:0 25px 70px rgba(0,0,0,.22);
    --nav-height:68px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html{ background:#07151b; scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{ min-height:100vh; min-height:100dvh; font-family:"DM Sans",sans-serif; color:var(--text); background:radial-gradient(circle at 10% 0%, rgba(44,128,108,.13), transparent 28%), linear-gradient(135deg, #07151b, #092526 55%, #0b2929); overflow-x:hidden; -webkit-tap-highlight-color:transparent; padding-bottom:calc(var(--nav-height) + 10px); }
a{ color:inherit; text-decoration:none; }
button, input, select, textarea{ font-family:inherit; }
button{ cursor:pointer; }

/* TOPBAR */
.topbar{ height:64px; position:sticky; top:0; z-index:500; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--line); background:rgba(7,21,27,.85); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.profile-section{ display:flex; align-items:center; }
.profile-section .avatar{ width:42px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden; background:linear-gradient(145deg, var(--mint), var(--green2)); color:#09201d; font-size:13px; font-weight:800; border:none; box-shadow:0 0 0 2px rgba(184,224,202,.12); transition:box-shadow .2s; }
.profile-section .avatar:hover{ box-shadow:0 0 0 3px rgba(184,224,202,.25); }

.topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.icon-button{ width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.025); color:#9aada7; display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s; }
.icon-button:hover{ background:rgba(184,224,202,.08); color:var(--mint); }
.icon-button svg{ width:16px; }

/* MODAL SHARED STYLES */
.bottom-sheet-backdrop { position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease; }
.bottom-sheet-backdrop.show { opacity: 1; visibility: visible; }
.bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; background: #0a1c30; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(184,224,202,.15); box-shadow: 0 -20px 60px rgba(0,0,0,.5); transform: translateY(100%); transition: transform .35s cubic-bezier(0.2, 0.8, 0.2, 1); max-height: 85vh; display: flex; flex-direction: column; }
.bottom-sheet.show { transform: translateY(0); }
.modal-drag-handle { width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); margin: 12px auto 4px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 16px; border-bottom: 1px solid var(--line); }
.modal-header h2 { font-family: "Manrope", sans-serif; font-size: 16px; font-weight: 700; }
.modal-close-btn { background: none; border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.modal-close-btn:hover { background: rgba(255,255,255,.05); color: #fff; }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; scrollbar-width: none; }
.modal-body::-webkit-scrollbar { display: none; }

.notification-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.04); cursor: pointer; }
.notification-item:last-child { border-bottom: none; padding-bottom: 30px; }
.notification-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: rgba(184,224,202,.06); color: var(--mint); display: flex; align-items: center; justify-content: center; }
.notification-icon svg { width: 18px; height: 18px; }
.notification-content { flex: 1; }
.notification-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.notification-title { font-size: 12px; font-weight: 700; color: #fff; }
.notification-time { font-size: 9px; color: var(--muted); }
.notification-message { font-size: 11px; color: #81958f; line-height: 1.5; }

/* =========================================================
   STUNNING BOTTOM NAVIGATION (GLASS-MORPHISM)
========================================================= */
.bottom-nav {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 1000;
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(10, 30, 32, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom);
    transition: background 0.3s ease, box-shadow 0.3s ease;
}

.bottom-nav a {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 100%;
    color: #6a8f84;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border-radius: 16px;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    min-width: 0;
    padding: 6px 0;
}

.bottom-nav a svg {
    width: 21px;
    height: 21px;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease;
}

.bottom-nav a.active {
    color: var(--mint);
    background: linear-gradient(180deg, rgba(184, 224, 202, 0.12) 0%, rgba(184, 224, 202, 0.02) 100%);
    border: 1px solid rgba(184, 224, 202, 0.15);
    box-shadow: 0 4px 16px rgba(184, 224, 202, 0.08), inset 0 1px 0 rgba(184, 224, 202, 0.15);
}

.bottom-nav a.active svg {
    transform: translateY(-2px) scale(1.05);
    filter: drop-shadow(0 0 10px rgba(184, 224, 202, 0.45));
}

.bottom-nav a.active span {
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 0 14px rgba(184, 224, 202, 0.35);
}

/* Animated gradient ring around active icon */
.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 224, 202, 0.12) 0%, transparent 70%);
    animation: navPulse 2.5s ease-in-out infinite;
    pointer-events: none;
}

/* Subtle top highlight line on active item */
.bottom-nav a.active::after {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 2.5px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, transparent, var(--mint), transparent);
    box-shadow: 0 0 10px rgba(184, 224, 202, 0.7);
    opacity: 0.9;
}

/* Hover / press states */
.bottom-nav a:not(.active):hover {
    color: #9ec4b6;
    background: rgba(184, 224, 202, 0.05);
}
.bottom-nav a:not(.active):active {
    background: rgba(184, 224, 202, 0.09);
    transform: scale(0.96);
}
.bottom-nav a:active {
    transform: scale(0.96);
}

@keyframes navPulse {
    0%, 100% {
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0.5;
    }
    50% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.9;
    }
}
/* ========================================================= */

/* CONTENT */
.content{ width:100%; padding:26px 0 30px; display: flex; flex-direction: column; align-items: center; }
.header-text{ text-align: center; margin-bottom: 24px; padding: 0 20px; }
.header-text h2{ font-family: "Manrope", sans-serif; font-size: 24px; margin-bottom: 8px; letter-spacing: -.5px; }
.header-text p{ color: var(--muted); font-size: 13px; line-height: 1.5; }

/* CAROUSEL */
.carousel-wrap{ width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; padding: 10px 0 30px; }
.carousel-wrap::-webkit-scrollbar { display: none; }
.carousel-inner{ display: flex; gap: 16px; padding: 0 20px; width: max-content; }
.card-slide{ scroll-snap-align: center; width: 300px; flex-shrink: 0; }

/* PREMIUM CARD DESIGNS */
.premium-card{ width: 100%; height: 190px; border-radius: 18px; padding: 22px; position: relative; overflow: hidden; transition: transform .3s ease, box-shadow .3s ease; box-shadow: 0 10px 30px rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1); }
.card-slide.active .premium-card{ transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,.5); border-color: rgba(255,255,255,.3); }

/* Card Themes */
.theme-debit{ background: linear-gradient(135deg, #1b5e52, #0b2929); }
.theme-credit{ background: linear-gradient(135deg, #4a5568, #1a202c); }
.theme-black{ background: linear-gradient(135deg, #111, #000); border-color: rgba(201,169,107,.3); }
.theme-diamond{ background: linear-gradient(135deg, #2b3a42, #839ca8, #2b3a42); border-color: rgba(255,255,255,.5); }
.theme-unlimited-debit{ background: linear-gradient(135deg, #0f2b45, #081c2e); border-color: rgba(100,180,255,.3); }
.theme-unlimited-credit{ background: linear-gradient(135deg, #2d1b3d, #160c1f); border-color: rgba(200,100,255,.3); }

/* Card Inner Elements */
.bank-card-top{ display:flex; justify-content:space-between; align-items:center; }
.card-brand{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.7); font-weight: 700; }
.contactless{ width:20px; height:20px; color: rgba(255,255,255,.7); }
.card-chip{ width:36px; height:26px; margin-top:24px; border-radius:5px; background:linear-gradient(135deg, #e6d5a7, #b89c61); }
.theme-black .card-chip { background: linear-gradient(135deg, #fceabb, #f8b500); }
.theme-diamond .card-chip { background: linear-gradient(135deg, #e0e0e0, #ffffff); }

.card-number{ margin-top:24px; font-family:"Manrope",sans-serif; font-size:16px; letter-spacing:3px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
.card-bottom{ display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; }
.card-name{ font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.8); }
.card-tier-name{ position: absolute; top: 22px; right: 22px; font-size: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,.3); backdrop-filter: blur(4px); }
.theme-black .card-tier-name{ color: var(--gold); }
.theme-diamond .card-tier-name{ color: #fff; background: rgba(0,0,0,.5); }

/* DETAILS BOX */
.details-box{ width: calc(100% - 40px); max-width: 400px; background: rgba(255,255,255,.035); border: 1px solid var(--line); padding: 24px; border-radius: 20px; margin-top: 10px; position: relative; }
.details-header{ display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.06); padding-bottom: 16px; }
.details-title h3{ font-family: "Manrope", sans-serif; font-size: 20px; margin-bottom: 4px; }
.details-title p{ font-size: 12px; color: var(--muted); }
.details-fee{ text-align: right; }
.details-fee span{ font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
.details-fee strong{ display: block; font-size: 18px; color: var(--mint); font-family: "Manrope", sans-serif; margin-top: 2px; }

.feature-list{ list-style: none; margin-bottom: 24px; }
.feature-list li{ display: flex; align-items: center; gap: 10px; font-size: 13px; color: #cbd5d1; margin-bottom: 12px; }
.feature-list svg{ width: 16px; height: 16px; color: var(--mint); flex-shrink: 0; }

.form-group{ margin-bottom: 20px; }
.form-group label{ display: block; font-size: 12px; color: #8fa39d; margin-bottom: 8px; }
.form-group input{ width: 100%; height: 48px; border-radius: 12px; border: 1px solid rgba(184,224,202,.2); background: rgba(0,0,0,.2); color: #fff; padding: 0 16px; font-size: 16px; outline: none; transition: border-color .2s; }
.form-group input:focus{ border-color: var(--mint); }

/* =========================================================
   ACTION BUTTON (with spinner support)
========================================================= */
.action-btn{
    width: 100%; height: 52px; border: 0; border-radius: 14px;
    background: linear-gradient(145deg,#b8e0ca,#75b79d);
    color: #09201d; font-weight: 800; font-size: 15px;
    cursor: pointer; transition: opacity .2s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    position: relative;
}
.action-btn:active{ transform: scale(.98); }
.action-btn:disabled{ opacity: .75; cursor: not-allowed; }

/* =========================================================
   LOADER SPINNER (Matching Dashboard's elegant loader)
========================================================= */
.btn-spinner{
    width: 22px;
    height: 22px;
    position: relative;
    border-radius: 50%;
    border: 2.5px solid rgba(9, 32, 29, 0.15);
    border-top-color: #09201d;
    border-right-color: rgba(9, 32, 29, 0.55);
    animation: btnSpin 0.85s linear infinite;
    flex-shrink: 0;
}
.btn-spinner::after{
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px solid rgba(9, 32, 29, 0.25);
    animation: btnPulse 1.4s ease-in-out infinite;
}
@keyframes btnSpin{
    to{ transform: rotate(360deg); }
}
@keyframes btnPulse{
    0%, 100%{ transform: scale(.85); opacity: .35; }
    50%{ transform: scale(1); opacity: 1; }
}

/* ========================================================= */

#error-msg{ color: #d98b8b; font-size: 12px; text-align: center; margin-bottom: 12px; min-height: 16px; }

/* SUCCESS STATE */
#success-view{ display: none; text-align: center; padding: 40px 20px; width: 100%; max-width: 400px; }
.success-icon{ width: 72px; height: 72px; background: rgba(184,224,202,.14); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--mint); font-size: 32px; box-shadow: 0 0 30px rgba(184,224,202,.2); }
#success-view h3{ font-family: 'Manrope', sans-serif; font-size: 24px; margin-bottom: 8px; }
#success-view p{ font-size: 14px; color: var(--muted); margin-bottom: 30px; line-height: 1.5; }

@media(max-width:760px){
    .bottom-nav{ left:8px; right:8px; bottom:8px; border-radius:24px; }
    .bottom-nav a{ font-size:7px; }
    .bottom-nav a svg{ width:19px; height:19px; }
}
@media(max-width:480px){
    .bottom-nav{ left:6px; right:6px; bottom:6px; border-radius:22px; padding:0 4px; }
    .bottom-nav a{ font-size:6.5px; gap:2px; padding:4px 0; }
    .bottom-nav a svg{ width:18px; height:18px; }
    .bottom-nav a.active::before{ width:36px; height:36px; }
}
@media(prefers-reduced-motion:reduce){ *, *::before, *::after{ transition:none!important; animation:none!important; } }
</style>
</head>

<script>
    const API_BASE = "https://capital-crest.onrender.com";

    // CARD DATA
    const cardTypes = [
        { id: "debit", name: "Standard Debit", theme: "theme-debit", fee: 5.00, minDeposit: 10, features: ["Daily limit: $5,000", "No monthly maintenance fee", "Contactless payments enabled"] },
        { id: "credit", name: "Platinum Credit", theme: "theme-credit", fee: 15.00, minDeposit: 50, features: ["Credit limit up to $5,000", "Cashback on all purchases", "Travel insurance included"] },
        { id: "black", name: "Black Signature", theme: "theme-black", fee: 99.00, minDeposit: 500, features: ["Unlimited spending limit", "24/7 Dedicated concierge", "Airport lounge access worldwide"] },
        { id: "diamond", name: "Diamond Elite", theme: "theme-diamond", fee: 199.00, minDeposit: 1000, features: ["Ultra-exclusive metal card", "5% Cashback on dining & travel", "Global VIP event invitations"] },
        { id: "unlimited-debit", name: "Unlimited Debit", theme: "theme-unlimited-debit", fee: 49.00, minDeposit: 100, features: ["No daily transaction limits", "Zero foreign exchange fees", "Free global ATM withdrawals"] },
        { id: "unlimited-credit", name: "Unlimited Credit", theme: "theme-unlimited-credit", fee: 149.00, minDeposit: 200, features: ["Adaptive credit limit", "Premium rewards program", "Comprehensive travel protection"] }
    ];

    let selectedCard = cardTypes[0];
    let currentUserName = "YOUR NAME";

    function getAccessToken(){
        const keys = ["access_token", "accessToken", "supabase_access_token", "supabaseAccessToken", "token", "session", "capitalCrestToken"];
        for(const key of keys){
            const value = localStorage.getItem(key);
            if(!value) continue;
            try{
                const parsed = JSON.parse(value);
                if(parsed?.access_token) return parsed.access_token;
                if(parsed?.session?.access_token) return parsed.session.access_token;
                if(parsed?.data?.session?.access_token) return parsed.data.session.access_token;
            }catch(error){ return value; }
        }
        return null;
    }

    async function apiRequest(endpoint, options = {}){
        const token = getAccessToken();
        if(!token) throw new Error("Authentication required");
        
        const headers = {
            Accept: "application/json",
            "Content-Type": "application/json",
            ...(options.headers || {}),
            Authorization: `Bearer ${token}`
        };

        const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        const data = await response.json();
        
        if(!response.ok) throw new Error(data?.message || "Request failed");
        return data;
    }

    // =========================================================
    // NOTIFICATIONS LOGIC
    // =========================================================
    const READ_NOTIFS_KEY = "capitalCrestReadNotifications";

    function getReadNotifications(){
        try {
            const saved = localStorage.getItem(READ_NOTIFS_KEY);
            return saved ? JSON.parse(saved) : [];
        } catch { return []; }
    }

    function markNotificationAsRead(id) {
        const read = getReadNotifications();
        if(!read.includes(String(id))) {
            read.push(String(id));
            localStorage.setItem(READ_NOTIFS_KEY, JSON.stringify(read));
        }
    }

    function formatNotifTime(dateString) {
        if(!dateString) return "";
        const date = new Date(dateString);
        if(isNaN(date.getTime())) return "";
        const now = new Date();
        const isToday = date.toDateString() === now.toDateString();
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const isYesterday = date.toDateString() === yesterday.toDateString();
        const time = date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        if(isToday) return `Today · ${time}`;
        if(isYesterday) return `Yesterday · ${time}`;
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` · ${time}`;
    }

    function getNotifIcon(type) {
        const t = String(type || "").toLowerCase();
        if(t.includes("login") || t.includes("security") || t.includes("password")) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>`;
        }
        if(t.includes("transfer") || t.includes("deposit") || t.includes("received")) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>`;
        }
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 9a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>`;
    }

    function renderNotifications(notifications) {
        const container = document.getElementById("notificationList");
        if(!container) return;

        if(!notifications || notifications.length === 0) {
            container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#81958f;">
                <p style="font-size:14px;">You're all caught up!</p>
                <p style="font-size:11px;margin-top:5px;">No new notifications.</p>
            </div>`;
            return;
        }

        const readIds = getReadNotifications();

        container.innerHTML = notifications.map(n => {
            const isUnread = !readIds.includes(String(n.id));
            const isSecurity = String(n.type || "").toLowerCase().includes("security");
            
            return `
                <div class="notification-item" onclick="handleNotifClick(${n.id}, this)">
                    <div class="notification-icon" style="${isSecurity ? 'color:#c9a96b;background:rgba(201,169,107,.06);' : ''}">
                        ${getNotifIcon(n.type)}
                    </div>
                    <div class="notification-content">
                        <div class="notification-top">
                            <strong class="notification-title">${n.title || "Notification"}</strong>
                            <span class="notification-time">${formatNotifTime(n.created_at)}</span>
                        </div>
                        <p class="notification-message">${n.message || n.body || ""}</p>
                    </div>
                    ${isUnread ? '<span class="unread-dot" style="width:6px;height:6px;border-radius:50%;background:var(--mint);flex-shrink:0;margin-top:5px;box-shadow:0 0 10px rgba(184,224,202,.65);"></span>' : ''}
                </div>
            `;
        }).join("");
    }

    window.handleNotifClick = function(id, element) {
        markNotificationAsRead(id);
        const dot = element.querySelector('.unread-dot');
        if(dot) dot.remove();
    };

    async function loadNotifications() {
        try {
            const res = await apiRequest("/api/notifications");
            let list = [];
            if(Array.isArray(res)) list = res;
            else if(res?.notifications) list = res.notifications;
            else if(res?.data) list = res.data;

            list.sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            renderNotifications(list);
        } catch (err) {
            console.warn("Could not load notifications", err);
            renderNotifications([]);
        }
    }

    // =========================================================
    // CAROUSEL & CARD LOGIC
    // =========================================================
    async function loadUserProfile(){
        try {
            const me = await apiRequest("/api/auth/me");
            const first = me.profile?.first_name || me.user?.first_name || "YOUR";
            const last = me.profile?.surname || me.user?.last_name || "NAME";
            currentUserName = `${first} ${last}`.toUpperCase();
            
            // Top-left avatar: show initials first, then swap to the profile photo once it loads
            const avatarBtn = document.querySelector('.profile-section .avatar');
            if(avatarBtn) {
                const initials = `${first.charAt(0)}${last.charAt(0)}`.toUpperCase();
                const avatarUrl = me.profile?.avatar_url || null;

                avatarBtn.textContent = initials;

                if(avatarUrl) {
                    const img = document.createElement("img");
                    img.alt = "Profile photo";
                    img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;";
                    img.onload = () => { avatarBtn.textContent = ""; avatarBtn.appendChild(img); };
                    img.onerror = () => { avatarBtn.textContent = initials; };
                    img.src = avatarUrl;
                }
            }

            renderCarousel(); 
        } catch(err) {
            console.warn("Could not load profile for preview");
        }
    }

    function renderCarousel() {
        const inner = document.getElementById("carouselInner");
        inner.innerHTML = cardTypes.map((card, index) => `
            <div class="card-slide ${index === 0 ? 'active' : ''}" data-id="${card.id}" data-index="${index}">
                <div class="premium-card ${card.theme}">
                    <div class="card-tier-name">${card.name}</div>
                    <div class="bank-card-top">
                        <span class="card-brand">Crest United</span>
                        <svg class="contactless" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 9a4 4 0 010 6"/><path d="M11 7a7 7 0 010 10"/><path d="M14 5a10 10 0 010 14"/></svg>
                    </div>
                    <div class="card-chip"></div>
                    <div class="card-number">•••• •••• •••• ••••</div>
                    <div class="card-bottom">
                        <span class="card-name">${currentUserName}</span>
                    </div>
                </div>
            </div>
        `).join("");

        document.querySelectorAll(".card-slide").forEach(slide => {
            slide.addEventListener("click", () => {
                document.querySelectorAll(".card-slide").forEach(s => s.classList.remove("active"));
                slide.classList.add("active");
                
                const index = Number(slide.dataset.index);
                selectCard(cardTypes[index]);
            });
        });
    }

    function selectCard(card) {
        selectedCard = card;
        
        document.getElementById("selCardName").textContent = card.name;
        document.getElementById("selCardFee").textContent = "$" + card.fee.toFixed(2);
        
        const featureList = document.getElementById("selCardFeatures");
        featureList.innerHTML = card.features.map(f => `
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                ${f}
            </li>
        `).join("");

        document.getElementById("depositAmount").placeholder = `Minimum $${card.minDeposit.toFixed(2)}`;
    }

    // =========================================================
    // SUBMIT BUTTON WITH SPINNER
    // =========================================================
    const submitBtn = document.getElementById("submitBtn");
    const originalBtnHTML = submitBtn.innerHTML;

    submitBtn.addEventListener("click", async () => {
        const amountInput = document.getElementById("depositAmount").value;
        const amount = Number(amountInput);
        const errEl = document.getElementById("error-msg");

        errEl.textContent = "";

        if (!amount || amount < selectedCard.minDeposit) {
            errEl.textContent = `Minimum initial deposit for this card is $${selectedCard.minDeposit.toFixed(2)}`;
            return;
        }

        // === SHOW SPINNER ===
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="btn-spinner"></span><span>Issuing your card…</span>`;

        try {
            const res = await apiRequest("/api/cards/issue", {
                method: "POST",
                body: JSON.stringify({ 
                    card_type: selectedCard.id,
                    card_name: selectedCard.name,
                    fee: selectedCard.fee,
                    initial_deposit: amount 
                })
            });

            if(res.success) {
                // Brief pause so the user sees the spinner complete gracefully
                await new Promise(r => setTimeout(r, 350));
                document.getElementById("main-content").style.display = "none";
                document.getElementById("success-view").style.display = "block";
            } else {
                throw new Error(res.message || "Unable to issue card. Please try again.");
            }
        } catch(err) {
            errEl.textContent = err.message || "Unable to issue card. Please try again.";
            // === RESTORE BUTTON ===
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHTML;
        }
    });

    // =========================================================
    // MODAL CONTROLS
    // =========================================================
    function setupBottomSheet(btnId, modalId, backdropId, closeBtnId) {
        const btn = document.getElementById(btnId);
        const modal = document.getElementById(modalId);
        const backdrop = document.getElementById(backdropId);
        const closeBtn = document.getElementById(closeBtnId);

        function open() {
            modal.classList.add('show');
            backdrop.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function close() {
            modal.classList.remove('show');
            backdrop.classList.remove('show');
            document.body.style.overflow = '';
        }

        if(btn) btn.addEventListener('click', open);
        if(closeBtn) closeBtn.addEventListener('click', close);
        if(backdrop) backdrop.addEventListener('click', close);
        
        return { open, close };
    }

    // Initialize
    const notifControls = setupBottomSheet('openNotificationsBtn', 'notificationModal', 'notificationBackdrop', 'closeNotificationBtn');
    
    renderCarousel();
    selectCard(cardTypes[0]);
    loadUserProfile();
    loadNotifications();
</script>
</body>
</html>
